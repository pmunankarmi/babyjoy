name: Package WordPress release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find wordpress-theme wordpress-plugin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Package installable archives
        run: python3 scripts/package.py
      - name: Verify tag matches theme version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^Version: //p' wordpress-theme/babyjoy/style.css)
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/babyjoy.zip build/babyjoy-core.zip --verify-tag --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: babyjoy-wordpress
          path: build/*.zip
